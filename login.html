<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Data Inmobiliario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main>
  <div class="contenedor">
    <div class="acceso">
      <div class="lado-imagen">
        <div><div class="etiqueta-oro">Data Inmobiliario</div><h2>Bienvenido de nuevo</h2><p>Acceda a la central de información de arrendatarios.</p></div>
        <div data-ilustracion="edificio"></div>
      </div>
      <div class="lado-form">
    <div class="tarjeta">
      <h1>Ingresar</h1>
      <p class="tenue">Inmobiliarias, propietarios y personas.</p>
      <div id="msg"></div>
      <form id="formLogin">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" required placeholder="correo@empresa.com">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" required placeholder="••••••••">
        <button class="boton" type="submit">Ingresar</button>
      </form>
      <p style="margin-top:1rem">¿No tiene cuenta? <a href="registro.html">Regístrese aquí</a></p>
    </div>
      </div>
    </div>
  </div>
</main>
<script src="js/datos-semilla.js"></script>
<script src="js/almacen.js"></script>
<script src="js/ilustraciones.js"></script>
<script src="js/app.js"></script>
<script>
  function entrar(email, clave) {
    var u = Sesion.iniciar(email, clave);
    if (!u) { mensaje("msg", "error", "Correo o contraseña incorrectos."); return; }
    ir(parametro("volver") || "panel.html");
  }
  document.getElementById("formLogin").onsubmit = function (e) {
    e.preventDefault();
    entrar(document.getElementById("email").value, document.getElementById("clave").value);
  };
</script>
</body>
</html>
