<script>/* =========================================================
   REPORTE.JS - Construye el reporte del arrendatario.
   Se separa en su propio archivo porque lo usan dos páginas:
   reporte.html (quien consulta) y mi-historial.html (titular).
   ========================================================= */

/* Medidor semicircular (SVG) para el puntaje de 0 a 1000 */
function medidorSVG(puntaje, color) {
  var f = puntaje === null ? 0 : puntaje / 1000;
  var ang = Math.PI * (1 - f);
  var x = 100 + 80 * Math.cos(ang), y = 100 - 80 * Math.sin(ang);
  var arco = f > 0 ? '<path d="M20 100 A80 80 0 0 1 ' + x.toFixed(1) + " " + y.toFixed(1) + '" fill="none" stroke="' + color + '" stroke-width="18" stroke-linecap="round"/>' : "";
  return '<svg viewBox="0 0 200 115" role="img" aria-label="Puntaje ' + puntaje + ' de 1000">' +
    '<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#e3e8ee" stroke-width="18" stroke-linecap="round"/>' + arco +
    '<text x="20" y="114" font-size="9" fill="#6b7785" text-anchor="middle">0</text><text x="180" y="114" font-size="9" fill="#6b7785" text-anchor="middle">1000</text></svg>';
}

/* Vector de comportamiento: últimos 24 meses, sumando todos los contratos */
function vectorComportamiento(contratos) {
  var porPeriodo = {};
  contratos.forEach(function (c) {
    BD.pagosDe(c.id).forEach(function (p) { porPeriodo[p.periodo] = p; });
  });
  var html = '<div class="vector">';
  var f = new Date(); f.setDate(1); f.setMonth(f.getMonth() - 23);
  for (var i = 0; i < 24; i++) {
    var per = f.getFullYear() + "-" + dos(f.getMonth() + 1);
    var p = porPeriodo[per];
    if (p) {
      var cod = codigoMora(p);
      html += '<div class="mes ' + cod.clase + '" title="' + periodoTexto(per) + ": " + cod.nombre + '">' + cod.texto + "</div>";
    } else {
      html += '<div class="mes vacio" title="' + periodoTexto(per) + ': sin contrato reportado">–</div>';
    }
    f.setMonth(f.getMonth() + 1);
  }
  html += "</div>";
  html += '<div class="leyenda"><span><i style="background:var(--verde)"></i>N: al día</span><span><i style="background:var(--amarillo)"></i>1-29 días</span>' +
    '<span><i style="background:var(--naranja)"></i>30-59</span><span><i style="background:#b8452a"></i>60-89</span><span><i style="background:var(--rojo)"></i>90+</span>' +
    '<span><i style="background:#6d1a20"></i>S: siniestro (pagó la aseguradora)</span><span><i style="background:#e3e8ee"></i>sin contrato / en plazo</span></div>' +
    '<p class="ayuda">Del mes más antiguo (izquierda) al más reciente (derecha). Pase el mouse sobre cada cuadro para ver el detalle.</p>';
  return html;
}

function tablaPagos(resumen) {
  var html = '<div class="tabla-envoltura"><table><tr><th>Periodo</th><th>Fecha límite</th><th>Fecha de pago</th><th>Valor</th><th>Días de mora</th><th>Pagó</th></tr>';
  resumen.pagos.slice().reverse().forEach(function (p) {
    var d = diasMora(p), cod = codigoMora(p);
    var chip = cod.clase === "n" ? "verde" : cod.clase === "m1" ? "amarillo" : cod.clase === "vacio" ? "gris" : cod.clase === "m30" ? "naranja" : "rojo";
    html += "<tr><td>" + periodoTexto(p.periodo) + "</td><td>" + fechaCorta(p.fechaLimite) + "</td><td>" +
      (p.fechaPago ? fechaCorta(p.fechaPago) : '<span class="chip rojo">Sin pagar</span>') + "</td><td>" + pesos(p.valor) +
      '</td><td><span class="chip ' + chip + '">' + d + "</span></td><td>" + (p.pagadoPor || "—") + "</td></tr>";
  });
  return html + "</table></div>";
}

function construirReporte(cc, usuario) {
  var persona = BD.inquilino(cc);
  if (!persona) return '<div class="tarjeta"><h2>Sin información</h2><p>La cédula ' + esc(cc) + " no está registrada en la central.</p></div>";

  var contratos = BD.contratosDe(cc);
  var puntaje = calcularPuntaje(cc);
  var cat = categoriaPuntaje(puntaje);
  var resumenes = contratos.map(resumenContrato);

  var totalPagos = 0, aTiempo = 0, maxMora = 0, deuda = 0, siniestros = 0, sumaMora = 0, conMora = 0;
  resumenes.forEach(function (r, i) {
    totalPagos += r.total; aTiempo += r.aTiempo; deuda += r.deuda;
    if (r.maxMora > maxMora) maxMora = r.maxMora;
    if (contratos[i].siniestro) siniestros++;
    r.pagos.forEach(function (p) { var d = diasMora(p); if (d > 0) { sumaMora += d; conMora++; } });
  });
  var pct = totalPagos ? Math.round(aTiempo * 100 / totalPagos) : 0;
  var ultimo = contratos[contratos.length - 1];
  var rUltimo = resumenes[resumenes.length - 1];
  var edad = Math.floor((Date.now() - aFecha(persona.nacimiento)) / (365.25 * 86400000));

  var html = '<div class="tarjeta"><div class="reporte-cabecera"><div class="datos">' +
    '<p class="tenue" style="margin:0">REPORTE DE HISTORIAL DE ARRENDAMIENTO</p>' +
    "<h1>" + esc(persona.nombres + " " + persona.apellidos) + "</h1>" +
    "<p style='margin:.2rem 0'>C.C. <b>" + cc + "</b> · " + edad + " años · " + esc(persona.ocupacion) + " · " + esc(persona.ciudad) + "</p>" +
    "<p class='tenue' style='margin:.2rem 0'>Consultado por " + esc(usuario.nombre) + " el " + new Date().toLocaleString("es-CO") + "</p>" +
    "<p class='tenue' style='margin:.2rem 0'>Autorización de tratamiento de datos registrada el " + fechaCorta(persona.autorizacion) + "</p>" +
    '<p><span class="chip ' + cat.color + '" style="font-size:.95rem">' + cat.nombre + "</span></p><p>" + cat.texto + "</p></div>" +
    '<div class="medidor">' + medidorSVG(puntaje, cat.hex) + '<div class="puntaje" style="color:' + cat.hex + '">' + (puntaje === null ? "—" : puntaje) +
    '</div><div class="categoria" style="color:' + cat.hex + '">' + cat.nombre + "</div><div class='ayuda'>Puntaje de 0 a 1000</div></div></div></div>";

  if (!contratos.length) {
    return html + '<div class="alerta info">Esta persona está registrada pero <b>no tiene contratos de arrendamiento reportados</b>. No tener historial no es algo negativo: se recomienda pedir otras referencias o un codeudor.</div>';
  }

  // Alertas
  if (deuda > 0) html += '<div class="alerta error">⚠️ Tiene <b>' + pesos(deuda) + "</b> en cánones vencidos sin pagar actualmente.</div>";
  if (siniestros) html += '<div class="alerta error">⚠️ Registra <b>' + siniestros + "</b> siniestro(s): una aseguradora tuvo que pagarle al propietario por incumplimiento del inquilino.</div>";
  if (!deuda && !siniestros && pct >= 85) html += '<div class="alerta exito">✅ No registra deudas abiertas ni siniestros con aseguradoras.</div>';

  // Indicadores
  html += '<div class="grid grid-4">' +
    kpi(contratos.length, "Viviendas arrendadas") +
    kpi(duracion(contratos[0].fechaInicio, ultimo.fechaFin), "Tiempo con historial") +
    kpi(pct + "%", "Pagos a tiempo (" + aTiempo + " de " + totalPagos + ")") +
    kpi(conMora ? Math.round(sumaMora / conMora) + " días" : "0 días", "Promedio de mora cuando se atrasa") +
    kpi(maxMora + " días", "Mayor mora registrada") +
    kpi(pesos(deuda), "Deuda vencida actual") +
    kpi(pesos(rUltimo.ultimoCanon), "Último canon") +
    kpi(ultimo.fechaFin ? "Terminado" : "Vigente", "Contrato más reciente") + "</div>";

  // Último arrendamiento
  html += '<div class="tarjeta"><h2>Último arrendamiento</h2><div class="grid grid-3">' +
    "<div><b>Arrendador</b><br>" + esc(ultimo.arrendador) + "<br><span class='tenue'>" + ultimo.tipoArrendador + "</span></div>" +
    "<div><b>Inmueble</b><br>" + esc(ultimo.tipoInmueble + " · " + ultimo.direccion) + "<br><span class='tenue'>" + esc(ultimo.barrio + ", " + ultimo.ciudad) + " · Estrato " + ultimo.estrato + "</span></div>" +
    "<div><b>Último canon</b><br>" + pesos(rUltimo.ultimoCanon) + "<br><span class='tenue'>Desde " + fechaCorta(ultimo.fechaInicio) + (ultimo.fechaFin ? " hasta " + fechaCorta(ultimo.fechaFin) : " (vigente)") + "</span></div>" +
    '</div><p><span class="chip ' + rUltimo.resultado.chip + '">' + rUltimo.resultado.texto + "</span> " + estrellas(ultimo.calificacion) + " " + esc(ultimo.observacion || "") + "</p></div>";

  // Vector
  html += '<div class="tarjeta"><h2>Comportamiento de pago · últimos 24 meses</h2>' + vectorComportamiento(contratos) + "</div>";

  // Línea de tiempo
  html += '<div class="tarjeta"><h2>Historial de viviendas</h2><p class="tenue">Del contrato más reciente al más antiguo.</p><div class="linea-tiempo">';
  for (var i = contratos.length - 1; i >= 0; i--) {
    var c = contratos[i], r = resumenes[i], aseg = c.aseguradora ? BD.aseguradora(c.aseguradora) : null;
    html += '<div class="vivienda ' + r.resultado.clase + '">' +
      "<h3 style='margin:0'>" + esc(c.tipoInmueble + " · " + c.direccion) + "</h3>" +
      "<div class='tenue'>" + esc(c.barrio + ", " + c.ciudad) + " · Estrato " + c.estrato + "</div>" +
      "<p style='margin:.4rem 0'><b>" + fechaCorta(c.fechaInicio) + "</b> → <b>" + (c.fechaFin ? fechaCorta(c.fechaFin) : "Vigente") + "</b> (" + duracion(c.fechaInicio, c.fechaFin) + ")<br>" +
      "Arrendador: " + esc(c.arrendador) + " <span class='tenue'>(" + c.tipoArrendador + ")</span><br>" +
      "Canon inicial " + pesos(c.canon) + " · último canon " + pesos(r.ultimoCanon) + "<br>" +
      "Póliza de arrendamiento: " + (aseg ? esc(aseg.nombre) : "<span class='tenue'>Sin póliza</span>") +
      (c.siniestro ? ' <span class="chip rojo">Siniestro pagado por la aseguradora</span>' : "") + "<br>" +
      "Pagos a tiempo: <b>" + r.porcentaje + "%</b> · Mora promedio: " + r.promedioMora + " días · Mayor mora: " + r.maxMora + " días" +
      (r.deuda ? " · <b style='color:var(--rojo)'>Debe " + pesos(r.deuda) + "</b>" : "") + "</p>" +
      '<p style="margin:.2rem 0"><span class="chip ' + r.resultado.chip + '">' + r.resultado.texto + "</span> " + estrellas(c.calificacion) +
      (c.motivoTerminacion ? " <span class='tenue'>Terminación: " + esc(c.motivoTerminacion) + "</span>" : "") + "</p>" +
      (c.observacion ? "<p class='tenue' style='margin:.2rem 0'>Observación del arrendador: “" + esc(c.observacion) + "”</p>" : "") +
      "<details><summary>Ver los " + r.total + " pagos mes a mes</summary>" + tablaPagos(r) + "</details></div>";
  }
  html += "</div></div>";

  // Huella de consultas
  var huella = BD.datos.consultas.filter(function (q) { return q.cedula === cc; }).reverse().slice(0, 10);
  html += '<div class="tarjeta"><h2>Huella de consultas</h2><p class="tenue">Quién ha consultado este historial (la ley exige informarlo al titular).</p>';
  html += huella.length ? '<div class="tabla-envoltura"><table><tr><th>Fecha</th><th>Entidad</th><th>Motivo</th></tr>' + huella.map(function (q) {
    return "<tr><td>" + new Date(q.fecha).toLocaleString("es-CO") + "</td><td>" + esc(q.usuarioNombre) + "</td><td>" + esc(q.motivo) + "</td></tr>";
  }).join("") + "</table></div>" : "<p class='tenue'>Sin consultas registradas.</p>";
  html += "</div>";

  html += '<p class="ayuda">Este reporte es informativo y no constituye por sí solo una decisión de aprobar o negar un arriendo. El titular puede solicitar la corrección de datos inexactos en la sección "Mi historial". ' +
    'Modelo de puntaje académico simplificado. Datos 100 % ficticios.</p>';
  return html;
}

function kpi(valor, etiqueta) {
  return '<div class="tarjeta kpi"><div class="valor">' + valor + '</div><div class="etiqueta">' + etiqueta + "</div></div>";
}
function estrellas(n) {
  if (!n) return "";
  return '<span title="Calificación del arrendador: ' + n + ' de 5" style="color:#e0a800">' + "★★★★★".slice(0, n) + '<span style="color:#ccd3db">' + "★★★★★".slice(0, 5 - n) + "</span></span>";
}
</script>
<script>
/* ===== Enrutador de la versión de un solo archivo ===== */
var ACTUAL = "index.html", PARAMS = "";

},
"login.html": function () {
  function entrar(email, clave) {
    var u = Sesion.iniciar(email, clave);
    if (!u) { mensaje("msg", "error", "Correo o contraseña incorrectos."); return; }
    ir(parametro("volver") || "panel.html");
  }
  document.getElementById("formLogin").onsubmit = function (e) {
    e.preventDefault();
    entrar(document.getElementById("email").value, document.getElementById("clave").value);
  };
},
"registro.html": function () {
  var radios = document.querySelectorAll("input[name=tipo]");
  radios.forEach(function (r) {
    r.onchange = function () {
      var inmo = r.value === "inmobiliaria";
      document.getElementById("lblNombre").textContent = inmo ? "Razón social" : "Nombre completo";
      document.getElementById("lblDoc").textContent = inmo ? "NIT" : "Cédula";
    };
  });

  document.getElementById("formRegistro").onsubmit = function (e) {
    e.preventDefault();
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var tipo = document.querySelector("input[name=tipo]:checked").value;
    if (v("clave") !== v("clave2")) return mensaje("msg", "error", "Las contraseñas no coinciden.");
    if (BD.usuarioPorEmail(v("email"))) return mensaje("msg", "error", "Ya existe una cuenta con ese correo.");
    if (tipo === "persona" && !/^\d{6,10}$/.test(v("documento"))) return mensaje("msg", "error", "La cédula debe tener entre 6 y 10 dígitos, sin puntos.");

    var u = {
      id: BD.nuevoId("u"), tipo: tipo, nombre: v("nombre"), documento: v("documento"),
      email: v("email").toLowerCase(), clave: v("clave"), ciudad: v("ciudad"),
      creditos: 1 // regalo de bienvenida: 1 consulta
    };
    BD.datos.usuarios.push(u);
    BD.guardar();
    Sesion.iniciar(u.email, u.clave);
    ir("panel.html?nuevo=1");
  };
},
"panel.html": function () {
  var u = Sesion.exigir();
  var html = "";
  if (parametro("nuevo")) html += '<div class="alerta exito">¡Cuenta creada! Le regalamos 1 consulta para que pruebe la plataforma.</div>';

  html += '<h1>Hola, ' + esc(u.nombre) + '</h1><p class="tenue">' +
    (u.tipo === "inmobiliaria" ? "Cuenta de inmobiliaria · NIT " : "Cuenta de persona · Cédula ") + esc(u.documento) + "</p>";

  var misConsultas = BD.datos.consultas.filter(function (c) { return c.usuarioId === u.id; }).reverse();
  html += '<div class="grid grid-4">' +
    '<div class="tarjeta kpi"><div class="valor">' + u.creditos + '</div><div class="etiqueta">Consultas disponibles</div><a class="boton pequeno" style="margin-top:.6rem" href="comprar.html">Comprar más</a></div>' +
    '<div class="tarjeta kpi"><div class="valor">' + misConsultas.length + '</div><div class="etiqueta">Consultas realizadas</div></div>';

  if (u.tipo === "inmobiliaria") {
    var misContratos = BD.datos.contratos.filter(function (c) { return c.inmobiliaria === u.nombre; });
    var vigentes = misContratos.filter(function (c) { return !c.fechaFin; });
    html += '<div class="tarjeta kpi"><div class="valor">' + vigentes.length + '</div><div class="etiqueta">Contratos vigentes reportados</div></div>' +
      '<div class="tarjeta kpi"><div class="valor">' + misContratos.length + '</div><div class="etiqueta">Contratos totales reportados</div></div>';
  } else {
    var p = calcularPuntaje(u.documento);
    var cat = categoriaPuntaje(p);
    html += '<div class="tarjeta kpi"><div class="valor" style="color:' + cat.hex + '">' + (p === null ? "—" : p) + '</div><div class="etiqueta">Mi puntaje</div></div>' +
      '<div class="tarjeta kpi"><div class="valor" style="font-size:1.1rem;color:' + cat.hex + '">' + cat.nombre + '</div><div class="etiqueta">Mi calificación</div></div>';
  }
  html += "</div>";

  html += '<div class="tarjeta"><h2>Consulta rápida</h2><form id="rapida" class="fila" style="align-items:end">' +
    '<div><label for="cc">Número de cédula</label><input id="cc" inputmode="numeric" placeholder="Ej: 9990000104" required></div>' +
    '<div><button class="boton" type="submit">Buscar</button></div></form></div>';

  if (u.tipo === "inmobiliaria") {
    html += '<div class="tarjeta"><h2>Mis inquilinos reportados</h2><p class="tenue">Contratos que su inmobiliaria ha reportado a la central.</p>' +
      '<div class="tabla-envoltura"><table><tr><th>Inquilino</th><th>Cédula</th><th>Inmueble</th><th>Inicio</th><th>Estado</th><th>Cumplimiento</th><th></th></tr>';
    misContratos.forEach(function (c) {
      var i = BD.inquilino(c.cedula), r = resumenContrato(c);
      html += "<tr><td>" + esc(i ? i.nombres + " " + i.apellidos : "?") + "</td><td>" + c.cedula + "</td><td>" + esc(c.direccion) + ", " + esc(c.ciudad) +
        "</td><td>" + fechaCorta(c.fechaInicio) + "</td><td>" + (c.fechaFin ? '<span class="chip gris">Terminado</span>' : '<span class="chip azul">Vigente</span>') +
        '</td><td><span class="chip ' + r.resultado.chip + '">' + r.porcentaje + "% a tiempo</span></td>" +
        '<td><a href="ingreso-datos.html?contrato=' + c.id + '">Registrar pago</a></td></tr>';
    });
    if (!misContratos.length) html += '<tr><td colspan="7" class="tenue">Aún no ha reportado contratos. Use <a href="ingreso-datos.html">Ingresar datos</a>.</td></tr>';
    html += "</table></div></div>";
  } else {
    html += '<div class="tarjeta"><h2>Mi historial de arriendo</h2><p>Como titular puede ver gratis su reporte completo, saber quién lo ha consultado y pedir correcciones.</p>' +
      '<a class="boton verde" href="mi-historial.html">Ver mi historial</a></div>';
  }

  html += '<div class="tarjeta"><h2>Mis últimas consultas</h2><div class="tabla-envoltura"><table><tr><th>Fecha</th><th>Cédula</th><th>Nombre</th><th>Motivo</th><th></th></tr>';
  misConsultas.slice(0, 10).forEach(function (c) {
    var i = BD.inquilino(c.cedula);
    html += "<tr><td>" + new Date(c.fecha).toLocaleString("es-CO") + "</td><td>" + c.cedula + "</td><td>" + esc(i ? i.nombres + " " + i.apellidos : "No registrada") +
      "</td><td>" + esc(c.motivo) + '</td><td><a href="reporte.html?cc=' + c.cedula + '">Ver</a></td></tr>';
  });
  if (!misConsultas.length) html += '<tr><td colspan="5" class="tenue">Todavía no ha hecho consultas.</td></tr>';
  html += "</table></div></div>";

  document.getElementById("contenido").innerHTML = html;
  document.getElementById("rapida").onsubmit = function (e) {
    e.preventDefault();
    ir("consulta.html?cc=" + encodeURIComponent(document.getElementById("cc").value.trim()));
  };
},
"consulta.html": function () {
  var u = Sesion.exigir();
  document.getElementById("saldo").innerHTML = "Consultas disponibles: <b>" + u.creditos + "</b> · <a href='comprar.html'>Comprar más</a>";
  if (parametro("cc")) document.getElementById("cc").value = parametro("cc");

  document.getElementById("formConsulta").onsubmit = function (e) {
    e.preventDefault();
    var cc = document.getElementById("cc").value.replace(/\D/g, "");
    if (cc.length < 6) return mensaje("msg", "error", "Escriba una cédula válida (solo números).");

    // 1. ¿Ya pagó esta cédula en las últimas 24 h, o es su propia cédula? No se cobra de nuevo.
    if (tieneAcceso(u, cc)) { ir("reporte.html?cc=" + cc); return; }

    // 2. ¿Existe la persona en la central? Si no existe, no se cobra.
    if (!BD.inquilino(cc)) {
      return mensaje("msg", "aviso", "La cédula <b>" + cc + "</b> no está registrada en Data Inmobiliario. No se descontó ninguna consulta.");
    }

    // 3. ¿Tiene saldo? Si no, se envía a comprar.
    if (u.creditos < 1) {
      return mensaje("msg", "error", "No tiene consultas disponibles. <a href='comprar.html?cc=" + cc + "'>Pagar esta consulta ahora (" + pesos(PRECIO_CONSULTA) + ")</a>");
    }

    // 4. Descontar crédito, registrar la consulta (bitácora) y dar acceso.
    u.creditos -= 1;
    var ahora = Date.now();
    BD.datos.consultas.push({ id: BD.nuevoId("Q"), usuarioId: u.id, usuarioNombre: u.nombre, cedula: cc, motivo: document.getElementById("motivo").value, fecha: ahora });
    BD.datos.accesos.push({ usuarioId: u.id, cedula: cc, fecha: ahora });
    BD.guardar();
    ir("reporte.html?cc=" + cc);
  };
},
"comprar.html": function () {
  var u = Sesion.exigir();
  var PLANES = [
    { id: "p1", nombre: "Consulta individual", creditos: 1, valor: 15000 },
    { id: "p10", nombre: "Paquete inmobiliaria (10)", creditos: 10, valor: 120000 },
    { id: "p50", nombre: "Paquete empresarial (50)", creditos: 50, valor: 500000 }
  ];
  var plan = PLANES[parametro("cc") ? 0 : 1];
  var medio = "tarjeta";

  function pintarPlanes() {
    document.getElementById("planes").innerHTML = PLANES.map(function (p) {
      return '<label class="check" style="border:1px solid var(--borde);border-radius:8px;padding:.6rem;margin:.4rem 0">' +
        '<input type="radio" name="plan" value="' + p.id + '"' + (p.id === plan.id ? " checked" : "") + '>' +
        "<span><b>" + p.nombre + "</b><br><span class='tenue'>" + pesos(p.valor) + " · " + pesos(p.valor / p.creditos) + " por consulta</span></span></label>";
    }).join("");
    document.querySelectorAll("input[name=plan]").forEach(function (r) {
      r.onchange = function () { plan = PLANES.find(function (p) { return p.id === r.value; }); pintarResumen(); };
    });
  }
  function pintarResumen() {
    var iva = Math.round(plan.valor - plan.valor / 1.19);
    document.getElementById("resumen").innerHTML =
      "<tr><td>Plan</td><td>" + plan.nombre + "</td></tr><tr><td>Consultas</td><td>" + plan.creditos + "</td></tr>" +
      "<tr><td>Subtotal</td><td>" + pesos(plan.valor - iva) + "</td></tr><tr><td>IVA (19 %)</td><td>" + pesos(iva) + "</td></tr>" +
      "<tr><th>Total</th><th>" + pesos(plan.valor) + "</th></tr>";
    document.getElementById("btnPagar").textContent = "Pagar " + pesos(plan.valor);
  }
  pintarPlanes(); pintarResumen();

  // Cambiar entre tarjeta y PSE
  document.querySelectorAll("[data-medio]").forEach(function (b) {
    b.onclick = function () {
      medio = b.dataset.medio;
      document.querySelectorAll("[data-medio]").forEach(function (x) { x.classList.toggle("activa", x === b); });
      document.getElementById("formTarjeta").classList.toggle("oculto", medio !== "tarjeta");
      document.getElementById("formPse").classList.toggle("oculto", medio !== "pse");
    };
  });

  // Vista previa de la tarjeta
  var num = document.getElementById("numTarjeta");
  num.oninput = function () {
    var d = num.value.replace(/\D/g, "").slice(0, 16);
    num.value = d.replace(/(\d{4})(?=\d)/g, "$1 ");
    document.getElementById("vistaNum").textContent = (d + "••••••••••••••••").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
  };
  document.getElementById("nomTarjeta").oninput = function (e) {
    document.getElementById("vistaNombre").textContent = e.target.value.toUpperCase() || "NOMBRE DEL TITULAR";
  };

  /* Algoritmo de Luhn: valida que el número de tarjeta sea coherente */
  function luhn(numero) {
    var suma = 0, doble = false;
    for (var i = numero.length - 1; i >= 0; i--) {
      var n = +numero[i];
      if (doble) { n *= 2; if (n > 9) n -= 9; }
      suma += n; doble = !doble;
    }
    return numero.length >= 13 && suma % 10 === 0;
  }

  function procesar(aprobado, motivo, detalleMedio) {
    mensaje("msg", "info", "⏳ Procesando pago simulado…");
    document.querySelectorAll("#zonaCompra button").forEach(function (b) { b.disabled = true; });
    setTimeout(function () {
      document.querySelectorAll("#zonaCompra button").forEach(function (b) { b.disabled = false; });
      if (!aprobado) return mensaje("msg", "error", "❌ Transacción rechazada: " + motivo);
      var compra = {
        id: "DI-" + Date.now().toString().slice(-8), usuarioId: u.id, plan: plan.nombre, creditos: plan.creditos,
        valor: plan.valor, medio: detalleMedio, fecha: Date.now(), estado: "APROBADA"
      };
      u.creditos += plan.creditos;
      BD.datos.compras.push(compra);
      BD.guardar();
      document.getElementById("zonaCompra").classList.add("oculto");
      var c = document.getElementById("comprobante");
      c.classList.remove("oculto");
      c.innerHTML = '<h2>✅ Pago aprobado (simulado)</h2><table>' +
        "<tr><td>Referencia</td><td><b>" + compra.id + "</b></td></tr><tr><td>Fecha</td><td>" + new Date(compra.fecha).toLocaleString("es-CO") + "</td></tr>" +
        "<tr><td>Cliente</td><td>" + esc(u.nombre) + " · " + esc(u.documento) + "</td></tr><tr><td>Plan</td><td>" + compra.plan + "</td></tr>" +
        "<tr><td>Medio</td><td>" + esc(compra.medio) + "</td></tr><tr><td>Valor</td><td>" + pesos(compra.valor) + "</td></tr>" +
        "<tr><td>Saldo de consultas</td><td><b>" + u.creditos + "</b></td></tr></table>" +
        (parametro("cc") ? '<a class="boton" href="consulta.html?cc=' + encodeURIComponent(parametro("cc")) + '">Continuar con la consulta</a>' : '<a class="boton" href="consulta.html">Hacer una consulta</a>') +
        ' <button class="boton secundario no-imprimir" onclick="print()">Imprimir comprobante</button>';
    }, 1800);
  }

  document.getElementById("formTarjeta").onsubmit = function (e) {
    e.preventDefault();
    var n = num.value.replace(/\D/g, "");
    var venc = document.getElementById("venc").value;
    if (!luhn(n)) return mensaje("msg", "error", "El número de tarjeta no es válido (falla la verificación de Luhn).");
    var m = venc.match(/^(\d{2})\/(\d{2})$/);
    if (!m || +m[1] < 1 || +m[1] > 12 || new Date(2000 + +m[2], +m[1], 0) < new Date()) return mensaje("msg", "error", "Fecha de vencimiento inválida o tarjeta vencida.");
    if (!/^\d{3,4}$/.test(document.getElementById("cvv").value)) return mensaje("msg", "error", "CVV inválido.");
    var rechazada = n === "4000000000000002";
    procesar(!rechazada, "fondos insuficientes", "Tarjeta terminada en " + n.slice(-4) + " · " + document.getElementById("cuotas").value + " cuota(s)");
  };
  document.getElementById("formPse").onsubmit = function (e) {
    e.preventDefault();
    procesar(true, "", "PSE · " + document.getElementById("banco").value);
  };
},

"ingreso-datos.html": function () {
  var u = Sesion.exigir(["inmobiliaria"]);
  var datos = function (form) { return Object.fromEntries(new FormData(form).entries()); };
  function ok(t) { mensaje("msg", "exito", t); scrollTo(0, 0); }
  function error(t) { mensaje("msg", "error", t); scrollTo(0, 0); }

  // ----- Pestañas -----
  function abrir(id) {
    document.querySelectorAll(".pestanas button").forEach(function (b) { b.classList.toggle("activa", b.dataset.p === id); });
    document.querySelectorAll(".panel-pestana").forEach(function (p) { p.classList.toggle("activa", p.id === id); });
  }
  document.querySelectorAll(".pestanas button").forEach(function (b) { b.onclick = function () { abrir(b.dataset.p); }; });

  // ----- Listas desplegables -----
  function misContratos() { return BD.datos.contratos.filter(function (c) { return c.inmobiliaria === u.nombre; }); }
  function nombreDe(cc) { var i = BD.inquilino(cc); return i ? i.nombres + " " + i.apellidos : cc; }
  function refrescarListas() {
    document.getElementById("listaCedulas").innerHTML = BD.datos.inquilinos.map(function (i) {
      return '<option value="' + i.cedula + '">' + esc(i.nombres + " " + i.apellidos) + "</option>";
    }).join("");
    document.getElementById("selAseg").innerHTML = '<option value="">Sin póliza</option>' + BD.datos.aseguradoras.map(function (a) {
      return '<option value="' + a.id + '">' + esc(a.nombre) + "</option>";
    }).join("");
    var opc = function (c) { return '<option value="' + c.id + '">' + esc(nombreDe(c.cedula)) + " · " + esc(c.direccion) + " (" + (c.fechaFin ? "terminado" : "vigente") + ")</option>"; };
    var mios = misContratos();
    document.getElementById("selContratoPago").innerHTML = mios.length ? mios.map(opc).join("") : '<option value="">No tiene contratos registrados</option>';
    var vig = mios.filter(function (c) { return !c.fechaFin; });
    document.getElementById("selContratoFin").innerHTML = vig.length ? vig.map(opc).join("") : '<option value="">No tiene contratos vigentes</option>';
  }
  refrescarListas();
  document.getElementById("arrendador").value = u.nombre;
  document.getElementById("chkGenerar").onchange = function (e) { document.getElementById("zonaPerfil").classList.toggle("oculto", !e.target.checked); };

  // ----- 1. Guardar inquilino -----
  document.getElementById("pInquilino").onsubmit = function (e) {
    e.preventDefault();
    var d = datos(e.target);
    if (BD.inquilino(d.cedula)) return error("Ya existe un inquilino con la cédula " + esc(d.cedula) + ".");
    BD.datos.inquilinos.push({ cedula: d.cedula, nombres: d.nombres, apellidos: d.apellidos, nacimiento: d.nacimiento, ciudad: d.ciudad,
      telefono: d.telefono, email: d.email, ocupacion: d.ocupacion || "No informada", autorizacion: d.autorizacion });
    BD.guardar(); e.target.reset(); refrescarListas();
    ok("Inquilino <b>" + esc(d.nombres + " " + d.apellidos) + "</b> registrado. Ahora registre su contrato en la pestaña 2.");
    abrir("pContrato");
    document.querySelector("#pContrato [name=cedula]").value = d.cedula;
  };

  // ----- 2. Guardar contrato -----
  document.getElementById("pContrato").onsubmit = function (e) {
    e.preventDefault();
    var d = datos(e.target);
    if (!BD.inquilino(d.cedula)) return error("La cédula " + esc(d.cedula) + " no está registrada. Regístrela primero en la pestaña 1.");
    if (d.fechaFin && d.fechaFin <= d.fechaInicio) return error("La fecha de fin debe ser posterior a la de inicio.");
    if (d.fechaInicio > aTexto(new Date())) return error("La fecha de inicio no puede ser futura.");
    var c = { id: BD.nuevoId("C"), cedula: d.cedula, inmobiliaria: u.nombre, arrendador: d.arrendador, tipoArrendador: d.tipoArrendador,
      direccion: d.direccion, barrio: d.barrio, ciudad: d.ciudad, estrato: +d.estrato, tipoInmueble: d.tipoInmueble,
      fechaInicio: d.fechaInicio, fechaFin: d.fechaFin || null, canon: +d.canon, aseguradora: d.aseguradora || null,
      perfil: d.perfil || "", motivoTerminacion: d.fechaFin ? "Entrega al vencimiento" : "", calificacion: 0, observacion: "" };
    BD.datos.contratos.push(c);
    var n = 0;
    if (d.generar) {
      var nuevos = generarPagos(c, d.perfil, crearAleatorio(Date.now() % 100000));
      BD.datos.pagos = BD.datos.pagos.concat(nuevos);
      n = nuevos.length;
    }
    BD.guardar(); e.target.reset(); refrescarListas();
    document.getElementById("arrendador").value = u.nombre;
    ok("Contrato guardado" + (n ? " con " + n + " pagos simulados" : "") + ". <a href='reporte.html?cc=" + c.cedula + "'>Ver cómo queda el reporte</a> o registre pagos en la pestaña 3.");
    // La inmobiliaria que reporta puede ver el resultado de su propio reporte sin pagar
    BD.datos.accesos.push({ usuarioId: u.id, cedula: c.cedula, fecha: Date.now() }); BD.guardar();
    fPago.contratoId.value = c.id; sugerirPago();
  };

  // ----- 3. Pagos -----
  var fPago = document.getElementById("pPago");
  function contratoSel() { return BD.datos.contratos.find(function (c) { return c.id === fPago.contratoId.value; }); }
  function sugerirPago() {
    var c = contratoSel(); if (!c) return;
    var pagos = BD.pagosDe(c.id);
    var ult = pagos[pagos.length - 1];
    var sig;
    if (ult) { var f = aFecha(ult.periodo + "-01"); f.setMonth(f.getMonth() + 1); sig = f; } else { sig = aFecha(c.fechaInicio); }
    fPago.periodo.value = sig.getFullYear() + "-" + dos(sig.getMonth() + 1);
    fPago.fechaLimite.value = fPago.periodo.value + "-05";
    fPago.valor.value = ult ? ult.valor : c.canon;
    fPago.fechaPago.value = "";
    calcMora();
    document.getElementById("ultimosPagos").innerHTML = pagos.length ? tablaPagos({ pagos: pagos.slice(-6) }) : "<p class='tenue'>Sin pagos registrados.</p>";
  }
  function calcMora() {
    if (!fPago.fechaLimite.value) return;
    var d = diasMora({ fechaLimite: fPago.fechaLimite.value, fechaPago: fPago.fechaPago.value || null });
    document.getElementById("moraCalc").value = d + (fPago.fechaPago.value ? " días" : " días (a hoy, sin pagar)");
  }
  fPago.contratoId.onchange = sugerirPago;
  fPago.periodo.onchange = function () { fPago.fechaLimite.value = fPago.periodo.value + "-05"; calcMora(); };
  fPago.fechaLimite.onchange = calcMora;
  fPago.fechaPago.onchange = calcMora;
  fPago.onsubmit = function (e) {
    e.preventDefault();
    var d = datos(e.target), c = contratoSel();
    if (!c) return error("Seleccione un contrato.");
    var id = "P" + c.id + "-" + d.periodo;
    var existente = BD.datos.pagos.find(function (p) { return p.id === id; });
    var pago = { id: id, contratoId: c.id, periodo: d.periodo, fechaLimite: d.fechaLimite, fechaPago: d.fechaPago || null, valor: +d.valor, pagadoPor: d.fechaPago ? d.pagadoPor : null };
    if (existente) Object.assign(existente, pago); else BD.datos.pagos.push(pago);
    BD.guardar();
    ok("Pago de " + periodoTexto(d.periodo) + (existente ? " actualizado" : " registrado") + " para " + esc(nombreDe(c.cedula)) + ". Días de mora: <b>" + diasMora(pago) + "</b>.");
    sugerirPago();
  };

  // ----- 4. Terminar contrato -----
  document.getElementById("pTerminar").onsubmit = function (e) {
    e.preventDefault();
    var d = datos(e.target);
    var c = BD.datos.contratos.find(function (x) { return x.id === d.contratoId; });
    if (!c) return error("Seleccione un contrato vigente.");
    if (d.fechaFin < c.fechaInicio) return error("La fecha de terminación es anterior al inicio del contrato.");
    c.fechaFin = d.fechaFin; c.motivoTerminacion = d.motivo; c.calificacion = +d.calificacion;
    c.observacion = d.observacion; c.siniestro = !!d.siniestro;
    BD.guardar(); e.target.reset(); refrescarListas();
    ok("Contrato terminado. El reporte de " + esc(nombreDe(c.cedula)) + " ya refleja el cambio.");
  };

  // Si llega desde el panel con ?contrato=ID, abrir directamente la pestaña de pagos
  var pre = parametro("contrato");
  if (pre) { abrir("pPago"); fPago.contratoId.value = pre; }
  sugerirPago();
},
"aseguradoras.html": function () {
  var sel = document.getElementById("aseg");
  sel.innerHTML = BD.datos.aseguradoras.map(function (a) {
    return '<option value="' + a.id + '">' + esc(a.nombre) + " (" + (a.tarifa * 100).toFixed(1).replace(".", ",") + " %)</option>";
  }).join("");
  document.getElementById("tablaAseg").innerHTML = "<tr><th>Aseguradora</th><th>Tarifa mensual</th><th>Días de mora para avisar siniestro</th><th>Contratos asegurados</th><th>Siniestros</th></tr>" +
    BD.datos.aseguradoras.map(function (a) {
      var cs = BD.datos.contratos.filter(function (c) { return c.aseguradora === a.id; });
      return "<tr><td>" + esc(a.nombre) + "</td><td>" + (a.tarifa * 100).toFixed(1).replace(".", ",") + " %</td><td>" + a.diasSiniestro + "</td><td>" + cs.length +
        "</td><td>" + cs.filter(function (c) { return c.siniestro; }).length + "</td></tr>";
    }).join("");

  function calcular() {
    var canon = +document.getElementById("canon").value || 0;
    var admin = +document.getElementById("admin").value || 0;
    var a = BD.aseguradora(sel.value);
    var tasa = a.tarifa + (+document.getElementById("integral").value);
    var prima = (canon + admin) * tasa, iva = prima * 0.19;
    var caja = function (v, t) { return '<div class="kpi"><div class="valor">' + v + '</div><div class="etiqueta">' + t + "</div></div>"; };
    document.getElementById("resultado").innerHTML =
      caja(pesos(prima), "Prima mensual") + caja(pesos(iva), "IVA de la prima") +
      caja(pesos(prima + iva), "Total mensual a la aseguradora") + caja(pesos(canon - prima - iva), "Le queda al propietario (antes de la comisión de la inmobiliaria)");
  }
  document.querySelectorAll("#canon,#admin,#aseg,#integral").forEach(function (el) { el.oninput = calcular; el.onchange = calcular; });
  calcular();
},
