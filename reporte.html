<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de arrendatario · Data Inmobiliario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<main>
  <div class="contenedor" id="contenido"></div>
</main>
<script src="js/datos-semilla.js"></script>
<script src="js/almacen.js"></script>
<script src="js/ilustraciones.js"></script>
<script src="js/app.js"></script>
<script src="js/reporte.js"></script>
<script>
  var u = Sesion.exigir();
  var cc = parametro("cc") || "";
  var cont = document.getElementById("contenido");
  if (!tieneAcceso(u, cc)) {
    cont.innerHTML = '<div class="tarjeta"><h2>Reporte no disponible</h2><p>Para ver el reporte de la cédula <b>' + esc(cc) +
      '</b> primero debe realizar (y pagar) la consulta. El acceso dura 24 horas.</p><a class="boton" href="consulta.html?cc=' + encodeURIComponent(cc) + '">Ir a consultar</a></div>';
  } else {
    cont.innerHTML = '<p class="no-imprimir"><a href="panel.html">← Volver al panel</a> · <a href="#" onclick="print();return false">Imprimir / guardar PDF</a></p>' +
      construirReporte(cc, u);
  }
</script>
</body>
</html>
